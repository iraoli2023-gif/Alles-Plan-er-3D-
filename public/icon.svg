<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="102" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />
  
  <!-- CAD Grid lines -->
  <path d="M64 128 h384 M64 256 h384 M64 384 h384 M128 64 v384 M256 64 v384 M384 64 v384" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Isometric / 3D Room Box outline -->
  <path d="M256 100 L410 180 L256 260 L102 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="6" opacity="0.85" />
  <path d="M102 180 L102 330 L256 410 L256 260 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <path d="M410 180 L410 330 L256 410 L256 260 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />

  <!-- Wiring line -->
  <path d="M140 210 L190 236 L190 310 L256 345" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="140" cy="210" r="7" fill="#f59e0b" />
  <circle cx="256" cy="345" r="9" fill="#10b981" />

  <!-- High-voltage / Energy bolt in center -->
  <polygon points="266,130 220,240 260,240 230,350 300,220 256,220" fill="url(#boltGrad)" />
</svg>
